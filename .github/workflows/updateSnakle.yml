name: Update image cache URL

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨运行（UTC）
  workflow_dispatch:

# 仅更新 README 中蛇图的缓存参数，使用仓库自带 GITHUB_TOKEN 推送。
permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update README cache URL
        shell: bash
        run: |
          set -euo pipefail
          date_utc=$(date -u +'%Y%m%d')
          sed -E -i "s#(github-contribution-grid-snake\.svg\?v=)[0-9]+#\1${date_utc}#" README.md
          grep -q 'github-contribution-grid-snake.svg?v=' README.md

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo 'README 已是当天版本，无需提交。'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'chore: refresh image cache URL'
          git push origin HEAD:${{ github.event.repository.default_branch }}
